name: kafka-streams-examples
lang: java
lang_version: "17"
code_artifact:
  enable: true
  package_paths:
    - "maven-snapshots/maven/io.confluent/kafka-streams.examples"
git:
  enable: true
codeowners:
  enable: true
semaphore:
  enable: true
  pipeline_type: cp-dockerfile
  # 'blocks' is deliberately omitted so ServiceBot does not regenerate it. The build blocks in
  # .semaphore/semaphore.yml are gated to also run on master; without this, that gating is reset
  # on the next ServiceBot regeneration and master builds nothing again.
  managed_sections:
    - version
    - name
    - agent
    - fail_fast
    - execution_time_limit
    - queue
    - global_job_config
    - after_pipeline
  docker_repos: ['confluentinc/kafka-streams-examples']
  community_docker_repos: []
  community_maven_modules: []
  maven_phase: 'package' # streams examples integration-test needs host-based networking, won't work in CI as-is
  maven_skip_deploy: true
  build_arm: true
  nano_version: true
  sign_images: true
  triggers: ['branches', 'pull_requests']
  os_types: ['ubi9']
  use_packages: true
  push_latest: true
  tasks:
    - name: cp-dockerfile-build
      branch: master
      pipeline_file: .semaphore/cp_dockerfile_build.yml
      parameters:
        - name: CONFLUENT_VERSION
          required: true
        - name: PACKAGES_URL
          required: false
        - name: PACKAGES_MAVEN_URL
          required: false
        - name: PACKAGING_BUILD_NUMBER
          required: true
        - name: ALLOW_UNSIGNED
          required: false
          default_value: 'False'
          options:
            - 'True'
            - 'False'
        - name: CONFLUENT_DEB_VERSION
          required: false
          default_value: '1'
        - name: SKIP_COMMUNITY
          required: false
          default_value: 'False'
          description: 'Skip building community docker images'
          options:
            - 'True'
            - 'False'
    - name: cp-dockerfile-promote
      branch: master
      pipeline_file: .semaphore/cp_dockerfile_promote.yml
      parameters:
        - name: CONFLUENT_VERSION
          required: true
        - name: IMAGE_REVISION
          required: true
          default_value: '1'
        - name: UPDATE_LATEST_TAG
          required: true
        - name: PACKAGING_BUILD_NUMBER
          required: true
        - name: PROMOTE_OS_TYPE
          required: true
          options:
            - 'deb'
            - 'ubi'
        - name: SKIP_COMMUNITY
          required: false
          default_value: 'False'
          description: 'Skip publishing community docker images'
          options:
            - 'True'
            - 'False'
